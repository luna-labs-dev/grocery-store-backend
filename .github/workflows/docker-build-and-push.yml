name: Build and Push Docker Image (Tagged)

on:
  push:
    tags:
      - 'v*'  # Triggers on git tag like v1.0.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to fetch tags

      - name: Get Git tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Log in to Docker registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{variables.DOCKER_REGISTRY}}/your-app:${{ steps.tag.outputs.tag }} .
          docker tag ${{variables.DOCKER_REGISTRY}}/your-app:${{ steps.tag.outputs.tag }} ${{variables.DOCKER_REGISTRY}}/your-app:latest

      - name: Push Docker image (tagged + latest)
        run: |
          docker push ${{variables.DOCKER_REGISTRY}}/your-app:${{ steps.tag.outputs.tag }}
          docker push ${{variables.DOCKER_REGISTRY}}/your-app:latest
